name: Lint and Test

env:
  dependencies: libgtk-4-1 libadwaita-1-0
  go-version: stable

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: golangci-lint
        run: go tool golangci-lint run --disable=errcheck

  go-test-sanitizers:
    name: go test ${{ matrix.flag }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        flag: [-race, -asan]
    env:
      CGO_ENABLED: 1
      # Deep enough for fontconfig's recursive rule evaluation to show
      # the pango frame that a suppression matches.
      ASAN_OPTIONS: detect_leaks=1:malloc_context_size=128
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp:print_suppressions=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.dependencies }} xvfb
      - name: Install Debug Symbols
        if: matrix.flag == '-asan'
        # Ubuntu's libraries only carry exported symbols, which can't tell
        # pango's caches from objects we leak, so the suppressions need
        # their debug symbols.
        run: |
          sudo apt-get install -y ubuntu-dbgsym-keyring
          echo "deb http://ddebs.ubuntu.com $(lsb_release -cs) main universe" | sudo tee /etc/apt/sources.list.d/ddebs.list
          echo "deb http://ddebs.ubuntu.com $(lsb_release -cs)-updates main universe" | sudo tee -a /etc/apt/sources.list.d/ddebs.list
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0-dbgsym libpangoft2-1.0-0-dbgsym libpangocairo-1.0-0-dbgsym libfontconfig1-dbgsym
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: go test ${{ matrix.flag }}
        run: xvfb-run -a go test -v -vet=all ${{ matrix.flag }} ./...

  go-fix:
    name: go fix
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: go fix
        run: go fix -diff ./...

  exit-node-selection:
    name: exit node selection
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Model check
        run: .agents/skills/verify-exit-node-selection/scripts/check-exit-node-selection
      - name: Harness tests
        run: .agents/skills/verify-exit-node-selection/scripts/run-harness-tests -v

  metainfo-validate:
    name: metainfo validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
      - name: appstreamcli validate
        run: appstreamcli validate --pedantic --no-net --explain dev.deedles.Trayscale.metainfo.xml

  commit-subjects:
    name: commit subjects
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: bash .github/check-commit-subjects.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
