name: Lint and Test

env:
  dependencies: libgtk-4-1 libadwaita-1-0
  go-version: stable

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: golangci-lint
        run: go tool golangci-lint run --disable=errcheck

  go-test:
    name: go test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.dependencies }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: go test
        run: go test -v -vet=all ./...

  go-test-sanitizers:
    name: go test ${{ matrix.flag }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        flag: [-race, -asan]
    env:
      CGO_ENABLED: 1
      ASAN_OPTIONS: detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp:print_suppressions=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.dependencies }} xvfb
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: go test ${{ matrix.flag }}
        run: xvfb-run -a go test -v ${{ matrix.flag }} ./...

  go-fix:
    name: go fix
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
      - name: go fix
        run: go fix -diff ./...

  metainfo-validate:
    name: metainfo validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
      - name: appstreamcli validate
        run: appstreamcli validate --pedantic --no-net --explain dev.deedles.Trayscale.metainfo.xml
